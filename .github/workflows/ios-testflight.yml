name: iOS TestFlight

# Builds and uploads the iOS app from a GitHub-hosted runner.
#
# This exists because App Store Connect requires the iOS 26 SDK, which needs
# Xcode 26 — newer than the Xcode that builds the macOS release locally. The
# macos-26 runner has it, so iOS can ship without upgrading the dev machine.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  testflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # CFBundleVersion is derived from the commit count

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run tests
        run: swift test

      - name: Derive version numbers
        id: version
        run: |
          echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          # Must increase on every upload; App Store Connect rejects a repeat.
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$MACOS_CERT_P12_BASE64" | tr -d '[:space:]' \
            | openssl base64 -d -A > /tmp/cert.p12
          openssl pkcs12 -in /tmp/cert.p12 -noout -passin env:MACOS_CERT_PASSWORD

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm /tmp/cert.p12

          security find-identity -v -p codesigning build.keychain
          security find-identity -v -p codesigning build.keychain \
            | grep -q "Apple Distribution" \
            || { echo "::error::No 'Apple Distribution' identity in the .p12"; exit 1; }

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '[:space:]' \
            | openssl base64 -d -A > ~/private_keys/AuthKey.p8

      - name: Archive
        run: |
          xcodebuild archive \
            -project SelahBeat.xcodeproj \
            -scheme SelahBeat-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SelahBeat-iOS.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            DEVELOPMENT_TEAM=D4DDD7PH6S

      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath build/SelahBeat-iOS.xcarchive \
            -exportOptionsPlist Scripts/ExportOptions-AppStore.plist \
            -exportPath build/ios-upload \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Clean up
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -rf ~/private_keys
