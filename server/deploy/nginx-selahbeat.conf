# nginx server block for SelahBeat, to ADD alongside your existing sites.
#
#   sudo cp deploy/nginx-selahbeat.conf /etc/nginx/sites-available/selahbeat
#   sudo ln -s /etc/nginx/sites-available/selahbeat /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d selahbeat.com
#
# Do not replace nginx.conf or your default site — this is an additional file.

server {
    listen 80;
    listen [::]:80;
    server_name selahbeat.com;

    # certbot rewrites this block to add TLS and a redirect.

    location / {
        proxy_pass http://127.0.0.1:3411;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
    }

    # The app polls this on launch; it is cheap and safe to cache briefly.
    location /v1/ {
        proxy_pass http://127.0.0.1:3411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
